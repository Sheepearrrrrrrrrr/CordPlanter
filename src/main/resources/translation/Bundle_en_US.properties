command.workspace.settings.set.already.1=\ is already in that state.
command.workspace.settings.set.already.0=
command.workspace.settings.set.0=
command.workspace.settings.set.1=\ is now 
command.workspace.settings.set.2=.
command.workspace.settings.set.enabled=enabled
command.workspace.settings.set.disabled=disabled
command.workspace.settings.set.operator.main=!!! WARNING !!! Enabling this option grants workspaces the power to GRANT OPERATOR STATUS to any Player, etc. This can be used as a force-op exploit, even through harmless looking stuff like text replacement. Only enable this option if you really need it.
command.workspace.settings.set.operator.reset=\nClick here to reset this setting.
command.workspace.settings.set.operator.reset.hover=RESET SETTING
# /workspace settings reset
command.workspace.settings.reset=Successfully reset the plugin settings.
command.workspace.settings.reset.success.1=Successfully reset the 
command.workspace.settings.reset.success.2=\ setting.
